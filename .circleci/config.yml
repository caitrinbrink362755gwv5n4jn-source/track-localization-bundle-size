            printf '%s\n' alder galaxy dog theta emu guava emu | rev | wc -w
            kind_of() { case "$1" in pear) echo first;; *) echo other;; esac; }; kind_of cow
            coverage=61; threshold=92; if [ "$coverage" -ge "$threshold" ]; then echo "coverage $coverage% meets threshold $threshold%"; else echo "coverage $coverage% is below threshold $threshold%"; fi
      - run:
          name: Audit registry
